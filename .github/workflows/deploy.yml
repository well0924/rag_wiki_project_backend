name: Backend Deploy

# 서버(EC2) 준비 전까지는 수동 실행만 허용 (Actions 탭 → Backend Deploy → Run workflow)
# 서버 준비 후 자동 배포로 전환하려면 아래 push 트리거 주석 해제
# 필요 Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY
on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]

jobs:
  # Jib으로 이미지 빌드 → GHCR 푸시 → EC2에서 compose 갱신
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Windows에서 커밋된 gradlew는 실행 권한이 없을 수 있음
      - run: chmod +x gradlew

      - name: Build & push image (Jib)
        run: >-
          ./gradlew jib --no-daemon
          -Djib.to.auth.username=${{ github.actor }}
          -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "~/wiki"
          strip_components: 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/wiki
            docker compose pull backend
            docker compose up -d
            docker image prune -f
