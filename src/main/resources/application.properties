spring.application.name=Wiki_Project
server.port=89
server.forward-headers-strategy=framework
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
# ===================================================================
# 1. Database & HikariCP Configuration
# ===================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
# reWriteBatchedInserts=true + PostgreSQL Active
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:wiki}?reWriteBatchedInserts=true
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:root}

spring.datasource.hikari.pool-name=WikiHikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ===================================================================
# 2. JPA & Hibernate Specification Advanced
# ===================================================================
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.order_inserts=true
spring.jpa.properties.hibernate.jdbc.order_updates=true

# ===================================================================
# 3. Security & JWT Configuration (Token & OAuth2)
# ===================================================================
jwt.secret=${JWT_SECRET}
jwt.access-expiration=1800000
jwt.refresh-expiration=1209600000

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# 리버스 프록시(Nginx) 뒤에서도 실제 공개 도메인 기준으로 생성되도록 {baseUrl} 사용
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.scope[0]=email
spring.security.oauth2.client.registration.google.scope[1]=profile

# ===================================================================
# 4. Spring Batch Configuration
# ===================================================================
# 배치 메타 테이블 자동 생성 (이미 있으면 건너뜀)
spring.batch.jdbc.initialize-schema=always
# 기동 시 자동 실행 방지 (DocumentSyncBatchScheduler가 주기 실행)
spring.batch.job.enabled=false
batch.document-hard-delete.enabled=${BATCH_HARD_DELETE_ENABLED:true}
batch.document-hard-delete.cron=${BATCH_HARD_DELETE_CRON:0 0 3 * * *}

# ===================================================================
# 5. Logging Level
# ===================================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=WARN


# ===================================================================
# 6. External Integration (AI Server / Frontend)
# ===================================================================
ai.fastapi.url=${AI_FASTAPI_URL:http://localhost:8000}
ai.fastapi.connect-timeout=${AI_FASTAPI_CONNECT_TIMEOUT:3s}
# LLM 답변 생성까지 기다리는 최대 시간
ai.fastapi.response-timeout=${AI_FASTAPI_RESPONSE_TIMEOUT:60s}
internal.api-key=${INTERNAL_API_KEY:local-internal-api-key}

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 인덱싱 상태 콜백이 이 시간 넘게 오지 않으면 FAILED 처리
document.indexing.timeout=${DOCUMENT_INDEXING_TIMEOUT:30m}
document.indexing.stuck-check-interval=${DOCUMENT_STUCK_CHECK_INTERVAL:PT10M}
